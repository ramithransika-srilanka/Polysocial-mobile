<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polysocial — Welcome to the creator economy</title>
<meta name="description" content="Polysocial connects creators and brands through performance-based campaigns. Tap in as a creator or as a brand.">
<link rel="canonical" href="https://polysocial.cc/bio">
<meta name="robots" content="noindex, follow">
<meta property="og:type" content="website">
<meta property="og:title" content="Welcome to the creator economy | Polysocial">
<meta property="og:description" content="Tap in as a creator or as a brand.">
<meta property="og:url" content="https://polysocial.cc/bio">
<meta property="og:image" content="https://polysocial.cc/og-share.png">
<meta name="theme-color" content="#F5F5F5">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/bio/fonts/inter-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/bio/img/group-800.webp" as="image" fetchpriority="high"
      imagesrcset="/bio/img/group-800.webp 800w, /bio/img/group.webp 1402w" imagesizes="(min-width: 480px) 480px, 100vw">
<style>
  @font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url(/bio/fonts/inter-latin-400.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 500; font-display: swap; src: url(/bio/fonts/inter-latin-500.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 600 700; font-display: swap; src: url(/bio/fonts/inter-latin-600.woff2) format("woff2"); }

  /* Tokens from the Polysocial design system (foundations in site/index.html). */
  :root {
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --blue-500: #1548EB;            /* --brand-primary */
    --blue-600: #123BBD;            /* --brand-primary-hover */
    --blue-700: #0F2D8F;            /* --brand-primary-pressed */
    --orange-500: #FF6B4A;          /* brand orange (hero CTA gradient, theme colour) */
    --orange-600: #E85A3B;
    --orange-700: #CC4B2F;
    --text-on-brand: #FFFFFF;
    --ink: #121212;                 /* hero headline black */
    --ink-muted: #ADADAD;           /* hero headline grey */
    --bg: #F5F5F5;                  /* matches the photo's sky */
    --radius-pill: 999px;
    --shadow-button: 2px 2px 12px 0px rgba(0,0,0,0.08);
    --type-button: 500 14px/16px var(--font-sans);   /* Inter Medium 14, as the home page CTA */
    --space-md: 16px;
    --space-xl: 24px;
    --space-2xl: 32px;

    --w: min(100vw, 480px);         /* column width = phone width in Instagram's browser */
    --photo-gap: 28px;              /* minimum space between contact buttons and photo */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  .page {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;             /* fill exactly the visible area of the in-app browser */
    display: flex;
    flex-direction: column;
  }

  .top {
    padding: max(calc(var(--w) * 0.14), calc(env(safe-area-inset-top) + 24px)) var(--space-md) 0;
    text-align: center;
  }

  /* Headline: same treatment as the home page hero */
  h1 {
    font-weight: 600;
    font-size: clamp(28px, calc(var(--w) * 0.082), 38px);
    line-height: 1.12;
    letter-spacing: -0.02em;
  }
  h1 > span { display: block; white-space: nowrap; }
  h1 .muted { color: var(--ink-muted); }
  h1 > .line { display: flex; align-items: center; justify-content: center; gap: 0.2em; margin-top: 0.08em; }

  .faces { display: inline-flex; align-items: center; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.16)); }
  .faces picture { display: block; flex: none; }
  .faces picture + picture { margin-left: -0.15em; }
  .faces img {
    display: block;
    width: 0.97em;
    height: 0.97em;
    border-radius: var(--radius-pill);
    object-fit: cover;
    border: 1.4px solid #F6F6F6;
    background: #ddd;
  }
  .faces picture:nth-child(1) img { animation: drift1 7.5s ease-in-out infinite; }
  .faces picture:nth-child(2) img { animation: drift2 8.7s ease-in-out infinite .6s; }
  .faces picture:nth-child(3) img { animation: drift3 6.9s ease-in-out infinite 1.1s; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) rotate(0deg); } 22% { transform: translate(1.6px,-2px) rotate(.7deg); } 48% { transform: translate(-1.4px,-.6px) rotate(-.5deg); } 70% { transform: translate(-1px,1.6px) rotate(.3deg); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) rotate(0deg); } 30% { transform: translate(-1.8px,1.2px) rotate(-.6deg); } 55% { transform: translate(1px,-1.8px) rotate(.5deg); } 80% { transform: translate(1.5px,.8px) rotate(-.3deg); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) rotate(0deg); } 26% { transform: translate(1.2px,1.6px) rotate(-.4deg); } 52% { transform: translate(-1.6px,-1px) rotate(.6deg); } 74% { transform: translate(.8px,-1.4px) rotate(-.5deg); } }

  /* Buttons: design-system primary pill. Inter Medium 14px,
     pill radius, --shadow-button, hover/pressed shades, 0.96 press scale. */
  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-md);
    margin-top: var(--space-2xl);
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(100%, 300px);
    height: 52px;
    padding: 0 var(--space-xl);
    border-radius: var(--radius-pill);
    color: var(--text-on-brand);
    font: var(--type-button);
    text-decoration: none;
    white-space: nowrap;
    box-shadow: var(--shadow-button);
    transition: transform .16s ease-out, background-color .16s ease-out;
  }
  .btn:active { transform: scale(.96); }
  .btn--creator { background: var(--orange-500); }
  .btn--creator:hover { background: var(--orange-600); }
  .btn--creator:active { background: var(--orange-700); }
  .btn--brand { background: var(--blue-500); }
  .btn--brand:hover { background: var(--blue-600); }
  .btn--brand:active { background: var(--blue-700); }
  .btn:focus-visible, .contact a:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 3px; }

  .contact {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: var(--space-xl);
  }
  .contact a {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: var(--radius-pill);
    background: var(--ink);
    color: #fff;
    box-shadow: var(--shadow-button);
    transition: transform .16s ease-out;
  }
  .contact a:active { transform: scale(.96); }
  .contact svg { width: 24px; height: 24px; }

  /* Photo: takes the space left under the contact buttons, always at least
     --photo-gap below them. With room to spare it sits on the bottom edge;
     on short screens it stays pinned under the gap and is cut off at the
     bottom (an auto margin collapses to 0 when the image is taller than its box). */
  .photo {
    flex: 1 1 0;
    min-height: calc(var(--w) * 0.5);
    margin-top: var(--photo-gap);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .photo img {
    display: block;
    flex: none;
    width: 100%;
    height: auto;
    margin-top: auto;
  }

  @media (max-height: 640px) {
    .top { padding-top: max(28px, calc(env(safe-area-inset-top) + 16px)); }
    .actions { margin-top: var(--space-xl); gap: 12px; }
    .contact { margin-top: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .faces img { animation: none; }
    .btn, .contact a { transition: none; }
  }
</style>
</head>
<body>
<main class="page">
  <section class="top">
    <h1>
      <span class="muted">Welcome to the</span>
      <span class="line">
        <span class="faces" aria-hidden="true">
          <picture><source type="image/avif" srcset="/assets/img/2fb456f2.220w.ea1f6e567f.avif"><source type="image/webp" srcset="/assets/img/2fb456f2.220w.69fb1c54b7.webp"><img src="/assets/img/2fb456f2.fallback.c759abd967.png" alt="" width="220" height="220" decoding="async"></picture>
          <picture><source type="image/avif" srcset="/assets/img/a14a7902.220w.2c14f172d6.avif"><source type="image/webp" srcset="/assets/img/a14a7902.220w.7c9f48bc2d.webp"><img src="/assets/img/a14a7902.fallback.33b48a6bb4.png" alt="" width="220" height="220" decoding="async"></picture>
          <picture><source type="image/avif" srcset="/assets/img/6776e340.220w.90e3414892.avif"><source type="image/webp" srcset="/assets/img/6776e340.220w.1647ac5db4.webp"><img src="/assets/img/6776e340.fallback.b9c0c160eb.png" alt="" width="220" height="220" decoding="async"></picture>
        </span>
        <span>creator</span>
      </span>
      <span>economy.</span>
    </h1>

    <nav class="actions" aria-label="Choose your path">
      <a class="btn btn--creator" href="/creators">Tap here if you are a creator</a>
      <a class="btn btn--brand" href="/brands">Tap here if you are a brand</a>
    </nav>

    <div class="contact">
      <a href="mailto:support@polysocial.cc" aria-label="Email Polysocial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
      </a>
      <a href="tel:+94772540134" aria-label="Call Polysocial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 1.1 4.2 2 2 0 0 1 3.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L7 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      </a>
    </div>
  </section>

  <div class="photo">
    <img src="/bio/img/group-800.webp"
         srcset="/bio/img/group-800.webp 800w, /bio/img/group.webp 1402w"
         sizes="(min-width: 480px) 480px, 100vw"
         width="1402" height="1122" fetchpriority="high" decoding="async"
         alt="Four friends laughing together in a selfie">
  </div>
</main>
</body>
</html>
