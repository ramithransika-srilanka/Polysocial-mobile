<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polysocial — Welcome to the creator economy</title>
<meta name="description" content="Polysocial connects creators and brands through performance-based campaigns. Tap in as a creator or as a brand.">
<link rel="canonical" href="https://polysocial.cc/bio">
<meta name="robots" content="noindex, follow">
<meta property="og:type" content="website">
<meta property="og:title" content="Welcome to the creator economy | Polysocial">
<meta property="og:description" content="Tap in as a creator or as a brand.">
<meta property="og:url" content="https://polysocial.cc/bio">
<meta property="og:image" content="https://polysocial.cc/og-share.png">
<meta name="theme-color" content="#F5F5F5">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/bio/fonts/inter-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/bio/img/group-800.webp" as="image" fetchpriority="high"
      imagesrcset="/bio/img/group-800.webp 800w, /bio/img/group.webp 1402w" imagesizes="(min-width: 480px) 480px, 100vw">
<style>
  @font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url(/bio/fonts/inter-latin-400.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 500; font-display: swap; src: url(/bio/fonts/inter-latin-500.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 600 700; font-display: swap; src: url(/bio/fonts/inter-latin-600.woff2) format("woff2"); }

  :root {
    --bg: #F5F5F5;
    --ink: #111111;
    --muted: #8F8F8F;
    --creator: #FF6C4B;
    --brand: #1548EB;
    /* everything scales off the column width (the phone width in Instagram's browser) */
    --w: min(100vw, 480px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  .page {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;           /* Instagram's in-app browser: fill exactly the visible area */
    display: flex;
    flex-direction: column;
  }

  .top {
    position: relative;
    z-index: 1;
    padding: calc(var(--w) * 0.15) 16px 0;
    padding-top: max(calc(var(--w) * 0.15), calc(env(safe-area-inset-top) + 24px));
    text-align: center;
  }

  h1 {
    font-weight: 700;
    font-size: clamp(26px, calc(var(--w) * 0.074), 36px);
    line-height: 1.32;
    letter-spacing: -0.015em;
  }
  h1 .muted { color: var(--muted); display: block; }
  h1 .line { display: block; white-space: nowrap; }

  .faces {
    display: inline-flex;
    vertical-align: -0.12em;
    margin-right: 0.12em;
  }
  .faces img {
    width: 0.92em;
    height: 0.92em;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
    object-fit: cover;
    background: #ddd;
  }
  .faces img + img { margin-left: -0.2em; }

  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(16px, calc(var(--w) * 0.048), 22px);
    margin-top: clamp(28px, calc(var(--w) * 0.088), 44px);
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(100%, max(260px, calc(var(--w) * 0.61)));
    height: clamp(46px, calc(var(--w) * 0.09), 54px);
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    font-size: clamp(16px, calc(var(--w) * 0.035), 18px);
    letter-spacing: 0.005em;
    box-shadow: 0 8px 18px -8px rgba(0, 0, 0, .25);
    transition: transform .15s ease, filter .15s ease;
  }
  .btn:active { transform: scale(.97); filter: brightness(.94); }
  .btn--creator { background: var(--creator); }
  .btn--brand { background: var(--brand); }

  .contact {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: clamp(24px, calc(var(--w) * 0.066), 34px);
  }
  .contact a {
    display: grid;
    place-items: center;
    width: clamp(42px, calc(var(--w) * 0.092), 48px);
    height: clamp(42px, calc(var(--w) * 0.092), 48px);
    border-radius: 50%;
    background: #111;
    color: #fff;
    transition: transform .15s ease;
  }
  .contact a:active { transform: scale(.93); }
  .contact svg { width: 50%; height: 50%; }

  /* The photo fills whatever height is left and sits on the bottom edge.
     Its sky is the same grey as the page, so cropping the top is invisible. */
  .photo {
    position: relative;
    flex: 1 0 auto;
    min-height: calc(var(--w) * 0.62);
    margin-top: 8px;
    overflow: hidden;
  }
  .photo img {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: auto;
    display: block;
  }
  /* short in-app viewports: tighten the top so the photo still shows faces */
  @media (max-height: 640px) {
    .top { padding-top: max(28px, calc(env(safe-area-inset-top) + 16px)); }
    .actions { margin-top: 22px; gap: 14px; }
    .contact { margin-top: 20px; }
  }

</style>
</head>
<body>
<main class="page">
  <section class="top">
    <h1>
      <span class="muted">Welcome to the</span>
      <span class="line"><span class="faces" aria-hidden="true"><img src="/bio/img/avatar-1.webp" alt="" width="48" height="48"><img src="/bio/img/avatar-2.webp" alt="" width="48" height="48"><img src="/bio/img/avatar-3.webp" alt="" width="48" height="48"></span>creator</span>
      <span class="line">economy.</span>
    </h1>

    <nav class="actions" aria-label="Choose your path">
      <a class="btn btn--creator" href="/creators">Tap here if you are a creator</a>
      <a class="btn btn--brand" href="/brands">Tap here if you are a brand</a>
    </nav>

    <div class="contact">
      <a href="mailto:support@polysocial.cc" aria-label="Email Polysocial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
      </a>
      <a href="tel:+94772540134" aria-label="Call Polysocial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 1.1 4.2 2 2 0 0 1 3.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L7 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      </a>
    </div>
  </section>

  <div class="photo">
    <img src="/bio/img/group-800.webp"
         srcset="/bio/img/group-800.webp 800w, /bio/img/group.webp 1402w"
         sizes="(min-width: 480px) 480px, 100vw"
         width="1402" height="1122" fetchpriority="high" decoding="async"
         alt="Four friends laughing together in a selfie">
  </div>
</main>
</body>
</html>
