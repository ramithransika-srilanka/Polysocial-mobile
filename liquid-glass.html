<title>Liquid Glass — Grow your brand</title>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000; }
  body {
    min-height: 240vh;                 /* scroll runway: ~2.4 screens */
    font-family: 'Inter', system-ui, -apple-system, Helvetica, Arial, sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
  }
  /* The WebGL surface is fixed and fills the viewport; the tall body scrolls behind it. */
  #gl {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    display: block; z-index: 1; touch-action: pan-y;
  }
  #fallback {
    position: fixed; inset: 0; z-index: 2; display: none;
    align-items: center; justify-content: center; text-align: center; padding: 32px;
    color: #cfcfcf; font-size: 15px; line-height: 1.5; background: #000;
  }

  /* Scroll hint — fades as motion begins */
  #hint {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(255,255,255,0.62); pointer-events: none;
    transition: opacity 420ms cubic-bezier(0.23,1,0.32,1);
  }
  #hint .mouse {
    width: 22px; height: 34px; border: 1.5px solid rgba(255,255,255,0.42);
    border-radius: 12px; position: relative;
  }
  #hint .mouse::after {
    content: ''; position: absolute; left: 50%; top: 6px; width: 3px; height: 6px;
    margin-left: -1.5px; border-radius: 2px; background: rgba(255,255,255,0.7);
    animation: hintDot 1.5s cubic-bezier(0.23,1,0.32,1) infinite;
  }
  @keyframes hintDot {
    0% { opacity: 0; transform: translateY(0); }
    30% { opacity: 1; }
    70% { opacity: 1; transform: translateY(10px); }
    100% { opacity: 0; transform: translateY(10px); }
  }

  /* --- Collapsible control panel (Figma-style params) --- */
  #panel {
    position: fixed; top: 12px; right: 12px; z-index: 4;
    width: 268px; max-width: calc(100vw - 24px);
    background: rgba(18,18,20,0.72); backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    border: 1px solid rgba(255,255,255,0.10); border-radius: 16px;
    font-size: 12px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,0.5);
  }
  #panelHead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; cursor: pointer; user-select: none;
    font-weight: 600; letter-spacing: 0.02em;
  }
  #panelHead .chev { transition: transform 220ms cubic-bezier(0.23,1,0.32,1); opacity: 0.7; }
  #panel.collapsed #panelHead .chev { transform: rotate(-90deg); }
  #panelBody {
    max-height: 74vh; overflow-y: auto; overscroll-behavior: contain;
    padding: 4px 14px 12px; transition: max-height 300ms cubic-bezier(0.23,1,0.32,1), opacity 220ms ease;
  }
  #panel.collapsed #panelBody { max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; }
  .row { margin: 11px 0; }
  .row .lab { display: flex; justify-content: space-between; margin-bottom: 6px; color: rgba(255,255,255,0.82); }
  .row .lab b { font-weight: 600; color: #fff; }
  .row .val { font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.62); font-weight: 500; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
    background: rgba(255,255,255,0.18); border-radius: 3px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: #fff; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    transition: transform 140ms cubic-bezier(0.23,1,0.32,1);
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.25); }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border: 0; border-radius: 50%; background: #fff; cursor: pointer;
  }
  .btns { display: flex; gap: 8px; margin-top: 14px; }
  .btns button {
    flex: 1; height: 34px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    transition: transform 140ms cubic-bezier(0.23,1,0.32,1), background 160ms ease;
  }
  .btns button:hover { background: rgba(255,255,255,0.12); }
  .btns button:active { transform: scale(0.97); }
  .btns button.ok { background: #fff; color: #111; border-color: #fff; }
  @media (prefers-reduced-motion: reduce) {
    #hint .mouse::after { animation: none; }
  }
</style>

     All coordinates in device pixels; text texture is the content behind the lens. */
  var FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'uniform vec2  uRes;',        // canvas size in device px
    'uniform vec2  uCenter;',     // circle centre (device px, y-down)
    'uniform float uRadius;',     // base radius (device px)
    'uniform float uSquash;',     // >1 stretch vertically, <1 squash
    'uniform sampler2D uText;',   // text texture (square, matches circle bbox)
    'uniform float uPx;',         // 1 device px in text-uv units (for blur taps)
    // params (already normalised to useful ranges on the JS side)
    'uniform float uRefraction;', // 0..~0.16 (uv units)
    'uniform float uDepth;',      // bezel width as fraction of radius 0.12..0.50
    'uniform float uDispersion;', // 0..1
    'uniform float uFrost;',      // 0..1
    'uniform float uSplayPow;',   // bezel falloff exponent
    'uniform float uBlur;',       // 0..1
    'uniform float uSpecular;',   // 0..1
    'uniform float uTint;',       // 0..1
    'uniform vec2  uLightDir;',   // unit vector, y-down
    'uniform float uLight;',      // 0..1
    'uniform float uReveal;',     // 0..1 text reveal wavefront
    'uniform float uTime;',

    'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }',

    // sample the content behind the lens at a text-uv, with reveal handling
    'vec4 sampleText(vec2 uv, float extraBlur){',
    '  if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0) return vec4(0.0);',
    '  float yv = uv.y;',                                   // 0 top .. 1 bottom
    '  float front = uReveal * 1.28;',                      // wavefront sweeps top->bottom
    '  float localR = clamp((front - yv) / 0.34, 0.0, 1.0);', // per-line reveal 0..1
    '  float rise = (1.0 - localR) * 0.05;',                // emerge with slight upward rise
    '  float revBlur = (1.0 - localR) * 5.0;',              // emerge from blur
    '  float b = extraBlur + revBlur;',
    '  vec2 suv = vec2(uv.x, uv.y + rise);',
    '  vec4 c;',
    '  if(b < 0.35){ c = texture2D(uText, suv); }',
    '  else {',
    '    float s = b * uPx;',
    '    c  = texture2D(uText, suv) * 0.28;',
    '    c += texture2D(uText, suv + vec2( s, 0.0)) * 0.18;',
    '    c += texture2D(uText, suv + vec2(-s, 0.0)) * 0.18;',
    '    c += texture2D(uText, suv + vec2(0.0,  s)) * 0.18;',
    '    c += texture2D(uText, suv + vec2(0.0, -s)) * 0.18;',
    '  }',
    '  c *= localR;',                                        // fade the line in
    '  return c;',
    '}',

    'void main(){',
    '  vec2 frag = vec2(vUv.x * uRes.x, (1.0 - vUv.y) * uRes.y);', // y-down device px
    '  vec3 bg = vec3(0.0);',                                // pure black background

    // squash-and-stretch ellipse (area-preserving-ish)
    '  float rx = uRadius / sqrt(uSquash);',
    '  float ry = uRadius * sqrt(uSquash);',
    '  vec2 pd = frag - uCenter;',
    '  vec2 nrm = vec2(pd.x / rx, pd.y / ry);',             // normalised, 1 at rim
    '  float d = length(nrm);',

    // anti-aliased circle mask; NO outer glow — hard edge into black
    '  float aa = 1.5 / uRadius;',
    '  float mask = 1.0 - smoothstep(1.0 - aa, 1.0, d);',
    '  if(mask <= 0.0){ gl_FragColor = vec4(bg, 1.0); return; }',

    '  vec2 dir = d > 0.0001 ? normalize(nrm) : vec2(0.0);',

    // bezel band: t = 0 inner edge .. 1 rim
    '  float bezelStart = 1.0 - uDepth;',
    '  float t = clamp((d - bezelStart) / max(uDepth, 0.001), 0.0, 1.0);',
    '  float shape = pow(t, uSplayPow);',                   // splay = falloff shape

    // Refraction bites hardest at the circumference:
    //   steep rim slope + edge-weighted boost (~1 + 2.2*(edge)^3)
    '  float edge = t;',                                    // 0 mid-bezel .. 1 rim
    '  float boost = 1.0 + 2.2 * edge * edge * edge;',
    '  float mag = uRefraction * shape * boost;',

    // directional lighting — how each point faces the light
    '  float ndl = dot(dir, uLightDir);',                   // +1 lit side, -1 far side
    '  float litFace = clamp(ndl, 0.0, 1.0);',

    // base refracted uv (bend inward = magnify centre content)
    '  vec2 uvC = vec2(0.5 + 0.5 * nrm.x, 0.5 + 0.5 * nrm.y);',
    '  vec2 ruv = uvC - dir * mag;',

    // chromatic dispersion rides the same edge boost, weighted toward the lit side
    '  float disp = uDispersion * shape * boost * 0.9;',
    '  float rimW = 0.10 + 0.90 * litFace;',                // bright on light side, ~nil on far side
    '  float ds = disp * (0.14 + 0.86 * rimW);',
    '  float baseBlur = uBlur * 6.0 + uFrost * 2.2;',
    '  vec4 cr = sampleText(ruv + dir * ds,       baseBlur);',
    '  vec4 cg = sampleText(ruv,                  baseBlur);',
    '  vec4 cb = sampleText(ruv - dir * ds,       baseBlur);',
    '  vec3 content = vec3(cr.r, cg.g, cb.b);',
    '  float ca = max(cr.a, max(cg.a, cb.a));',

    // start from the (black) glass body, composite the refracted text over it
    '  vec3 col = mix(bg, content, ca);',

    // Frost: faint milkiness + fine static grain
    '  if(uFrost > 0.0){',
    '    float grain = (hash(frag * 0.9) - 0.5) * 0.05 * uFrost;',
    '    col += grain;',
    '    col = mix(col, col + vec3(0.06), uFrost * 0.12);',
    '  }',

    // subtle glass tint (cool)
    '  col = mix(col, col * vec3(0.86, 0.90, 1.06) + vec3(0.02,0.03,0.05), uTint * 0.5);',

    // Bevel: bright highlight on the lit side, soft shadow opposite — visible even w/o specular
    '  float bevel = shape * uLight;',
    '  col += litFace * bevel * 0.9;',                      // lit rim brightens
    '  col -= clamp(-ndl,0.0,1.0) * bevel * 0.5;',          // far rim shades

    // Chromatic rim: coloured ring hugging the very edge, weighted by facing light
    '  float ring = smoothstep(0.86, 1.0, d) * (1.0 - smoothstep(0.995, 1.0, d));',
    '  vec3 rimCol = vec3(0.30,0.42,1.0)*0.5 + vec3(1.0,0.42,0.18)*0.5;',
    '  col += ring * rimW * (0.14 + uDispersion * 0.5) * rimCol;',

    // Specular: tight glossy hotspot placed on the lit side of the dome
    '  if(uSpecular > 0.0){',
    '    vec2 sp = -uLightDir * 0.55;',                     // hotspot centre inside the dome
    '    float sd = length(nrm - sp);',
    '    float spec = pow(clamp(1.0 - sd, 0.0, 1.0), 8.0) * uSpecular;',
    '    col += spec;',
    '  }',

    // fixed key glint on the lit shoulder so the glass never reads flat
    '  vec2 kp = -uLightDir * 0.62;',
    '  float kd = length(nrm - kp);',
    '  col += pow(clamp(1.0 - kd, 0.0, 1.0), 5.0) * (0.10 + uLight * 0.35);',

    '  gl_FragColor = vec4(col * mask, 1.0);',
    '}'
  ].join('\n');

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s), src); return null;
    }
    return s;
  }
  var vs = compile(gl.VERTEX_SHADER, VERT), fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) { document.getElementById('fallback').style.display = 'flex'; canvas.style.display = 'none'; return; }
  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var U = {};
  ['uRes','uCenter','uRadius','uSquash','uText','uPx','uRefraction','uDepth','uDispersion',
   'uFrost','uSplayPow','uBlur','uSpecular','uTint','uLightDir','uLight','uReveal','uTime']
    .forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });

  /* ------------------------------------------------------------------ *
   * Text texture — five lines auto-fit so the farthest corner ~= 99% R.
   * "brand" is masked with the embedded gradient; other lines are white.
   * ------------------------------------------------------------------ */
  var LINES = ['Grow', 'your', 'brand', 'with', 'us'];
  var BRAND_INDEX = 2;
  var tex = gl.createTexture();
  var texCanvas = document.createElement('canvas');
  var gradImg = new Image();
  var gradReady = false;
  gradImg.onload = function () { gradReady = true; buildTextTexture(); };
  gradImg.onerror = function () { gradReady = true; buildTextTexture(); };
  gradImg.src = GRADIENT_URI;

  var fontsReady = false;
  if (document.fonts && document.fonts.ready) {
    document.fonts.load('600 100px Inter').then(function(){}).catch(function(){});
    document.fonts.ready.then(function () { fontsReady = true; buildTextTexture(); });
  }

  var TEX_SIZE = 1024; // square, high-res; maps to the circle's bounding box

  function buildTextTexture() {
    var S = TEX_SIZE;
    texCanvas.width = S; texCanvas.height = S;
    var ctx = texCanvas.getContext('2d');
    ctx.clearRect(0, 0, S, S);

    // clip everything to the inscribed circle so text can never overflow the lens
    ctx.save();
    ctx.beginPath();
    ctx.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2);
    ctx.clip();

    var R = S / 2;
    var sizeMul = state.textSize / 100;      // Text Size %
    var gapMul  = state.lineGap / 100;        // Line Gap % (tight spacing)

    // Measure real glyph extents to auto-fit the block so the farthest corner ~= 99% R.
    // Binary search on font size.
    function metricsFor(fontPx) {
      ctx.font = '600 ' + fontPx + 'px Inter, sans-serif';
      var lineH = fontPx * gapMul;             // uniform tight line spacing
      var widths = [], asc = 0, desc = 0;
      for (var i = 0; i < LINES.length; i++) {
        var m = ctx.measureText(LINES[i]);
        widths.push(m.width);
        asc = Math.max(asc, m.actualBoundingBoxAscent || fontPx * 0.72);
        desc = Math.max(desc, m.actualBoundingBoxDescent || fontPx * 0.22);
      }
      var n = LINES.length;
      var totalH = (n - 1) * lineH + asc + desc;   // real block height
      // per-line baseline y (block centred vertically)
      var baselines = [];
      var top = -totalH / 2;
      for (var j = 0; j < n; j++) baselines.push(top + asc + j * lineH);
      // farthest corner distance from centre across all lines
      var maxD = 0;
      for (var k = 0; k < n; k++) {
        var halfW = widths[k] / 2;
        var yTop = baselines[k] - asc;     // top of glyph box for this line
        var yBot = baselines[k] + desc;    // bottom of glyph box
        var dy = Math.max(Math.abs(yTop), Math.abs(yBot));
        maxD = Math.max(maxD, Math.hypot(halfW, dy));
      }
      return { lineH: lineH, widths: widths, asc: asc, desc: desc, baselines: baselines, maxD: maxD };
    }

    var target = R * 0.99 * sizeMul;      // farthest corner should reach ~99% of R (scaled by Text Size)
    var lo = 20, hi = 400, best = 60, bestM = null;
    for (var iter = 0; iter < 26; iter++) {
      var mid = (lo + hi) / 2;
      var m = metricsFor(mid);
      if (m.maxD > target) { hi = mid; } else { lo = mid; best = mid; bestM = m; }
    }
    var fontPx = best;
    var M = bestM || metricsFor(fontPx);

    ctx.font = '600 ' + fontPx + 'px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';

    for (var i = 0; i < LINES.length; i++) {
      var by = R + M.baselines[i];
      if (i === BRAND_INDEX && gradReady) {
        // gradient-filled word: draw glyphs, then source-in the gradient image onto them
        var tmp = document.createElement('canvas');
        tmp.width = S; tmp.height = S;
        var tctx = tmp.getContext('2d');
        tctx.font = ctx.font; tctx.textAlign = 'center'; tctx.textBaseline = 'alphabetic';
        tctx.fillStyle = '#fff';
        tctx.fillText(LINES[i], R, by);
        tctx.globalCompositeOperation = 'source-in';
        var gw = M.widths[i] * 1.15, gh = fontPx * 1.25;
        tctx.drawImage(gradImg, R - gw / 2, by - M.asc, gw, gh);
        ctx.drawImage(tmp, 0, 0);
      } else {
        ctx.fillStyle = '#fff';
        ctx.fillText(LINES[i], R, by);
      }
    }
    ctx.restore();

    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, texCanvas);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }

  /* ------------------------------------------------------------------ *
   * Sizing / DPR
   * ------------------------------------------------------------------ */
  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(window.innerWidth * DPR);
    H = Math.round(window.innerHeight * DPR);
    canvas.width = W; canvas.height = H;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    gl.viewport(0, 0, W, H);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ------------------------------------------------------------------ *
   * Scroll → spring. Never bind visuals 1:1 to scrollY.
   * ------------------------------------------------------------------ */
  var spring = { value: 0, target: 0, vel: 0 };
  var K = 120, C = 20, Mmass = 1;      // stiffness, damping, mass

  function scrollProgress() {
    var max = (document.documentElement.scrollHeight - window.innerHeight);
    var y = window.scrollY || window.pageYOffset || 0;
    if (max <= 0) return 0;
    // transition completes over ~1.4 screens of scroll
    var span = window.innerHeight * 1.4;
    return Math.min(1, y / span);
  }

  var lastT = performance.now();
  var hint = document.getElementById('hint');
  var hintHidden = false;

  function frame(now) {
    var dt = Math.min(0.032, (now - lastT) / 1000 || 0.016);
    lastT = now;

    spring.target = scrollProgress();

    if (reduceMotion) {
      spring.value = spring.target; spring.vel = 0;
    } else {
      // semi-implicit spring integration
      var f = -K * (spring.value - spring.target) - C * spring.vel;
      spring.vel += (f / Mmass) * dt;
      spring.value += spring.vel * dt;
    }

    var p = spring.value;

    // fade the scroll hint out as motion begins
    if (!hintHidden && spring.target > 0.02) {
      hintHidden = true; hint.style.opacity = '0';
    } else if (hintHidden && spring.target <= 0.005) {
      hintHidden = false; hint.style.opacity = '1';
    }

    // Geometry: dome (1200px) rising from the bottom -> 450px centred circle.
    var vw = window.innerWidth, vh = window.innerHeight;
    var startDia = 1200, endDia = 450;
    var dia = startDia + (endDia - startDia) * p;
    var radiusCss = dia / 2;

    // vertical position: start with only ~140px cap visible above the bottom edge,
    // settle to vertical centre.
    var startCenterY = vh + (startDia / 2) - 140;   // centre far below screen, top cap peeks
    var endCenterY = vh / 2;
    var centerY = startCenterY + (endCenterY - startCenterY) * p;

    // velocity-driven squash-and-stretch (elongate while moving, round at rest)
    var squash = 1;
    if (!reduceMotion) {
      squash = 1 + Math.max(-0.18, Math.min(0.35, spring.vel * 0.9));
    }

    // reveal wavefront tracks the settle of the glass (Emil cascade), driven by same spring
    var reveal = Math.max(0, Math.min(1, (p - 0.28) / 0.62));

    // uniforms (convert css px -> device px)
    gl.uniform2f(U.uRes, W, H);
    gl.uniform2f(U.uCenter, (vw / 2) * DPR, centerY * DPR);
    gl.uniform1f(U.uRadius, radiusCss * DPR);
    gl.uniform1f(U.uSquash, squash);
    gl.uniform1f(U.uPx, 1.0 / TEX_SIZE);

    // map slider params to shader-friendly ranges
    gl.uniform1f(U.uRefraction, (state.refraction / 100) * 0.16);
    gl.uniform1f(U.uDepth, 0.12 + (state.depth / 100) * 0.38);            // 0.12 -> 0.50
    gl.uniform1f(U.uDispersion, (state.dispersion / 100) * 0.09);
    gl.uniform1f(U.uFrost, state.frost / 100);
    gl.uniform1f(U.uSplayPow, 0.4 + (1 - state.splay / 100) * 4.6);        // low splay = rim-hugging (high power)
    gl.uniform1f(U.uBlur, state.blur / 100);
    gl.uniform1f(U.uSpecular, state.specular / 100);
    gl.uniform1f(U.uTint, state.tint / 100);
    var a = state.lightAngle * Math.PI / 180;
    gl.uniform2f(U.uLightDir, Math.sin(a), -Math.cos(a));                  // angle from top, +cw; -45 = upper-left
    gl.uniform1f(U.uLight, state.light / 100);
    gl.uniform1f(U.uReveal, reveal);
    gl.uniform1f(U.uTime, now / 1000);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(U.uText, 0);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }

  buildTextTexture();
  requestAnimationFrame(frame);

  /* ------------------------------------------------------------------ *
   * Control panel
   * ------------------------------------------------------------------ */
  var body = document.getElementById('panelBody');
  var rowRefs = {};
  PARAMS.forEach(function (p) {
    var row = document.createElement('div'); row.className = 'row';
    var lab = document.createElement('div'); lab.className = 'lab';
    lab.innerHTML = '<b>' + p.label + '</b><span class="val">' + p.fmt(state[p.key]) + '</span>';
    var input = document.createElement('input');
    input.type = 'range'; input.min = p.min; input.max = p.max; input.step = p.step; input.value = state[p.key];
    input.addEventListener('input', function () {
      state[p.key] = parseFloat(input.value);
      lab.querySelector('.val').textContent = p.fmt(state[p.key]);
      if (p.key === 'textSize' || p.key === 'lineGap') buildTextTexture();  // rebuild text on those two
    });
    row.appendChild(lab); row.appendChild(input);
    body.appendChild(row);
    rowRefs[p.key] = { input: input, val: lab.querySelector('.val') };
  });

  var btns = document.createElement('div'); btns.className = 'btns';
  var resetBtn = document.createElement('button'); resetBtn.textContent = 'Reset';
  var copyBtn = document.createElement('button'); copyBtn.className = 'ok'; copyBtn.textContent = 'Copy';
  btns.appendChild(resetBtn); btns.appendChild(copyBtn);
  body.appendChild(btns);

  resetBtn.addEventListener('click', function () {
    PARAMS.forEach(function (p) {
      state[p.key] = p.def;
      rowRefs[p.key].input.value = p.def;
      rowRefs[p.key].val.textContent = p.fmt(p.def);
    });
    buildTextTexture();
  });
  copyBtn.addEventListener('click', function () {
    var obj = {}; PARAMS.forEach(function (p) { obj[p.key] = state[p.key]; });
    var text = JSON.stringify(obj, null, 2);
    var done = function () { copyBtn.textContent = 'Copied'; setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
    else { try { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); } catch (e) {} }
  });

  var panel = document.getElementById('panel');
  document.getElementById('panelHead').addEventListener('click', function () {
    panel.classList.toggle('collapsed');
  });

})();
</script>
