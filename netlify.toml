# Netlify serves polysocial.cc. Only site/ is published — scripts/, src-assets/,
# build/ and package.json stay private. No build command: the committed HTML in
# site/ is the source of truth (see README "Re-running the pipeline").
[build]
  publish = "site"

# Everything under /assets/ is content-fingerprinted by scripts/optimize.mjs, so
# a changed file always gets a new name and can be cached forever. HTML keeps
# Netlify's default (max-age=0, must-revalidate) so deploys show up immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
